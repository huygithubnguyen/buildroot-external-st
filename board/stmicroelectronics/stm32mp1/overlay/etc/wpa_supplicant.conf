# WPA Supplicant Configuration for STM32MP157F-DK2 Bike Computer
# Auto-connect to S23Portable network

ctrl_interface=/var/run/wpa_supplicant
ctrl_interface_group=wheel
update_config=1

# Network configuration for S23Portable
network={
    ssid="S23Portable"
    psk="AsdNhu123"
    key_mgmt=WPA-PSK
    priority=1
    id_str="bike_primary"
    # Auto-connect settings
    scan_ssid=1
    bgscan="simple:30:-70:30"
}

